    <script type="text/javascript">
    //加密请求参数
    function cryptoEncode(data,iv){
        var key = CryptoJS.enc.Utf8.parse("1234567887654321");
        var ivv = CryptoJS.enc.Utf8.parse(iv);
        var encrypted = CryptoJS.AES.encrypt(data, key, { iv: ivv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.ZeroPadding });
        data = encrypted.toString();
        var msg = {'data':data,'iv':iv};
        return msg;
    }
</script>

    function showmessage(info, second, result, url, lockMenu){
        // 默认值
        if (result == undefined){
            result = 'succeed';
        }
        if (url == undefined){
            url = null;
        }
        if (lockMenu == undefined){
            lockMenu = true;
        }
        if (second != undefined){
            if (window.top.art.dialog.list['beforeSendId']){
                window.top.art.dialog({id:'beforeSendId'}).close();
            }
            window.top.art.dialog({
                id: 'msgId',
                content: info,
                width:'auto',
                icon: result,
                lock: lockMenu,
                fixed: true,
                zIndex: 65536,
                init: function () {
                    var that = this, i = second;
                    var fn = function () {
                        that.title(i + '秒后关闭');
                        !i && that.close();
                        i --;
                    };
                    timer = setInterval(fn, 1000);
                    fn();
                },
                close: function () {
                    clearInterval(timer);
                    if(url != null){
                        window.location.href = url;
                    }
                }
            }).show();
        }else{
            if (window.top.art.dialog.list['beforeSendId']){
                window.top.art.dialog({id:'beforeSendId'}).close();
            }

        }
    }

    function setUrlParam(url,arg,arg_val){
	    var pattern=arg+'=([^&]*)';
	    var replaceText=arg+'='+arg_val;
	    if(url.match(pattern)){
		    var tmp='/('+ arg+'=)([^&]*)/gi';
		    tmp=url.replace(eval(tmp),replaceText);
		    return tmp;
	    }else{
		    if(url.match('[\?]')){
			    return url+'&'+replaceText;
		    }else{
			    return url+'?'+replaceText;
		    }
	    }
	    return url+'\n'+arg+'\n'+arg_val;
    }

<script type="text/javascript">
    function getMaxtouchPoints() {
        let maxTouchPoints = 0;
        if (typeof navigator.maxTouchPoints !== 'undefined') {
            maxTouchPoints = navigator.maxTouchPoints
        } else if (typeof navigator.msMaxTouchPoints !== 'undefined') {
            maxTouchPoints = navigator.msMaxTouchPoints
        }
        return maxTouchPoints;
    }

    function isMobile() {
        var u = navigator.userAgent, app = navigator.appVersion;
        var isWindows = app.indexOf('Windows') > -1;
        var isMac = app.indexOf('Macintosh') > -1;
        var isAndroid = u.indexOf('Android') > -1 || u.indexOf('Linux') > -1;
        var isIOS = !!u.match(/\(i[^;]+;( U;)? CPU.+Mac OS X/);
        if (isAndroid || isIOS) {
            return true;
        }
        if (isMac) {
            if (getMaxtouchPoints()>0){
                return true;
            }
        }
        return false;
    }

    function reloadMobile() {
        let href = window.location.href;
        if (isMobile()) {
	        window.location.href = setUrlParam(href,'is_mobile',1);
        }
        return "";
    }
</script>

    function changeUrlParam(url,arg,arg_val){
        var pattern=arg+'=([^&]*)';
        var replaceText=arg+'='+arg_val;
        if(url.match(pattern)){
            var tmp='/('+ arg+'=)([^&]*)/gi';
            tmp=url.replace(eval(tmp),replaceText);
            return tmp;
        }else{
            if(url.match('[\?]')){
                return url+'&'+replaceText;
            }else{
                return url+'?'+replaceText;
            }
        }
        return url+'\n'+arg+'\n'+arg_val;
    }

    function timeKeeper(start){
        if(start != ""){
            var nowDate=new Date();
            var now = parseInt(nowDate.getTime()/1000);
            var duration = now - start;
            var h = parseInt(duration/3600);
            var m = parseInt((duration-h*3600)/60);
            var s = (duration - h*3600 - m*60);
            h = h.toString();
            m = m.toString();
            s = s.toString();
            if(h.length<2){
                h = "0"+h;
            }
            if(m.length<2){
                m = "0"+m;
            }
            if(s.length<2){
                s = "0"+s;
            }
            $("#online_duration .h").html(h);
            $("#online_duration .m").html(m);
            $("#online_duration .s").html(s);
        }
    }

    function getCookie(key) {
        var name = key + "=";
        var decodedCookie = decodeURIComponent(document.cookie);
        var ca = decodedCookie.split(';');
        for(var i = 0; i <ca.length; i++) {
            var c = ca[i];
            while (c.charAt(0) == ' ') {
                c = c.substring(1);
            }
            if (c.indexOf(name) == 0) {
                return c.substring(name.length, c.length);
            }
        }
        return "";
    }

    function setCookie(key, value) {
        let keepDays = "7";
        let d = new Date();
		d.setTime(d.getTime() + Number(keepDays) * 86400000);
		document.cookie = key + '=' + value + ';expires=' + d.toUTCString();
    }

    function rememberMe(ac, act, pd) {
        setCookie('remember', 2);
        setCookie('ac', ac);
        setCookie('act', act);
        setCookie('pd', pd);
    }

    function forgetMe() { 
        setCookie('remember', '');
        setCookie('ac', '');
        setCookie('pd', '');
        setCookie('act', '');
    }

    function isShowPassText(obj){
        let id = $(obj).data('id');
        let showPass = $(".password-icon").hasClass('glyphicon-eye-open');
        if(id != undefined && id != '' && id != null){
            showPass = $(".icon" + id).hasClass('glyphicon-eye-open');
        }
        if(showPass){
            hidePassword(id);
        }else{
            showPassword(id);
        }
    }

    function setRememberMe(obj){
        let val = $(obj).data('selected');
        if (val == 2) {
            $(obj).addClass('refuse').data('selected', 1);
        } else {
            $(obj).removeClass('refuse').data('selected', 2);
        }
    }

    function showLoginForm(){
        $(".form-item").hide();
        $(".login-form-block").show();

    function offline(obj,formId){
        $(obj).attr('disabled',true);
        $.ajax({
            "type": "POST",
            "url": "/gportal/Web/logoutAction",
            "async":false,
            "data":$("#" + formId).serialize(),
            "success": function (c) {
                $(obj).attr('disabled',false);
                if(c.status == 1){
                    showmessage(c.info,4,'succeed','http://1.2.3.4');
                }else{
                    if(c.data = '133'){
                        showmessage(c.info,4,'error','http://1.2.3.4');
                    }else{
                        showmessage(c.info,4,'error',null);

            "error":function () {
                $(obj).attr('disabled',false);
            }
        });
    }
